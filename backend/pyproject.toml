[project]
name = "blood-report-backend"
version = "2.0.0"
description = "FastAPI backend for Blood Report Analyzer with self-hosted Ollama and Supabase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "supabase>=2.8.0",
    "gotrue>=2.9.0",
    "pdfplumber>=0.11.5",
    "filetype>=1.2.0",
    "langchain-text-splitters>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
