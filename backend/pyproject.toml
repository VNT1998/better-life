[project]
name = "betterlife-backend"
version = "2.0.0"
description = "FastAPI backend for BetterLife AI Clinical Evidence Intelligence Platform with self-hosted Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "supabase>=2.8.0",
    "gotrue>=2.9.0",
    "pdfplumber>=0.11.5",
    "filetype>=1.2.0",
    "langchain-text-splitters>=0.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pillow>=10.4.0",
    "bcrypt>=4.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "dist", "build", "migrations", "alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line length handled by ruff format
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "RUF012", # mutable class attributes should be annotated with ClassVar
    "PT009",  # use regular assert instead of unittest style
    "RUF001", # ambiguous characters in strings (medical symbols, en-dash in guidelines)
    "RUF002", # ambiguous characters in docstrings
    "RUF003", # ambiguous characters in comments
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "union-attr",
    "attr-defined",
    "index",
    "list-item",
    "operator",
]
exclude = [
    "\\.venv",
    "dist",
    "build",
    "tests",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
